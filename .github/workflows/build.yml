name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deb-arm64:
    name: deb-arm64
    runs-on: ubuntu-26.04-arm
    container:
      image: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git pkg-config ca-certificates curl dpkg \
            libasound2-dev portaudio19-dev libpulse-dev libpipewire-0.3-dev \
            libavahi-compat-libdnssd-dev

      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the deb package
        run: scripts/build.sh

      - name: Generate Checksums
        run: |
          cd dist
          shasum -a 256 *.deb > SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sendspin-cli-arm64-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error
  release:
    #if: ${{ startsWith(github.ref, 'refs/tags/') }}
    name: release
    runs-on: ubuntu-26.04-arm
    needs: deb-arm64
    container:
      image: debian:trixie
    steps:
      - name: Install gh
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gh

      - name: Fetch the artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sendspin-cli-arm64-deb
          path: dist/
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
          --repo "$GITHUB_REPOSITORY" \
          --title "sendspin-cli $GITHUB_REF_NAME" \
          --notes-start-tag "$GITHUB_REF_NAME" \
          --draft \
          --prerelease \
          --verify-tag \
          dist/*.deb dist/SHA256SUMS
